<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#07131f" />
  <title>Dijital Lansman | Yağan Dijital Sistemler</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root{--gold:#d4af37;--green:#41d98a}.launch-page{min-height:100vh;background:radial-gradient(circle at 78% 10%,rgba(8,125,247,.16),transparent 28%),linear-gradient(180deg,#020914,#06131f 58%,#020914);color:#f4f8fc}.launch-wrap{width:min(1180px,calc(100% - 32px));margin:auto}.launch-top{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(255,255,255,.06)}.launch-brand strong,.launch-brand span{display:block}.launch-brand strong{font-size:14px;letter-spacing:.08em}.launch-brand span{margin-top:4px;color:#879caf;font-size:11px}.launch-status{padding:8px 10px;border:1px solid #18476a;border-radius:999px;color:#d7e8f7;background:#081827;font-size:10px;font-weight:900;letter-spacing:.08em}.launch-status.completed{border-color:rgba(65,217,138,.3);color:#baf3d3;background:rgba(65,217,138,.08)}.launch-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;padding:86px 0 56px}.launch-eyebrow{color:#31b8ff;font-size:11px;font-weight:900;letter-spacing:.15em}.launch-hero h1{margin:14px 0 18px;font-size:clamp(48px,6vw,82px);line-height:.95;letter-spacing:-.05em}.launch-hero p{max-width:700px;color:#9fb1c3;font-size:17px;line-height:1.75}.launch-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.launch-stage{position:relative;min-height:430px;overflow:hidden;border:1px solid #17466b;border-radius:26px;background:linear-gradient(180deg,#10243a,#07131f);box-shadow:0 30px 80px rgba(0,0,0,.28)}.launch-stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 62% 48%,rgba(229,183,90,.45),transparent 14%),linear-gradient(130deg,transparent 0 54%,rgba(229,183,90,.08) 55% 55.6%,transparent 56%)}.stage-plane{position:absolute;right:14%;top:13%;font-size:58px;transform:rotate(-12deg)}.stage-train{position:absolute;right:10%;bottom:18%;width:48%;height:42%;border:2px solid rgba(212,175,55,.35);border-radius:28px 28px 11px 11px;background:linear-gradient(160deg,#173149,#081420);box-shadow:0 20px 45px rgba(0,0,0,.4)}.stage-train:before{content:"";position:absolute;left:20%;right:20%;top:18%;height:34%;border-radius:12px;background:linear-gradient(150deg,#25455d,#0a1a28)}.stage-train:after{content:"RUTYA";position:absolute;left:18px;bottom:15px;color:#e2bd6b;font-size:11px;font-weight:900;letter-spacing:.15em}.stage-copy{position:absolute;left:24px;right:24px;bottom:22px;padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(3,13,22,.7)}.stage-copy strong,.stage-copy span{display:block}.stage-copy strong{font-size:20px}.stage-copy span{margin-top:5px;color:#8fa4b7;font-size:11px}.launch-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 0 44px}.launch-meta>div{min-height:105px;padding:16px;border:1px solid #163b59;border-radius:16px;background:#081827}.launch-meta span,.launch-meta strong,.launch-meta small{display:block}.launch-meta span{color:#758b9e;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.launch-meta strong{margin-top:8px;font-size:12px;line-height:1.5}.launch-meta small{margin-top:6px;color:#9dafc0;font-size:10px}.launch-countdown{display:grid;grid-template-columns:auto repeat(4,1fr);gap:10px;align-items:stretch;margin:0 0 55px}.launch-countdown .intro,.launch-countdown .time{padding:18px;border:1px solid #173a58;border-radius:14px;background:#071725}.launch-countdown .intro{display:grid;align-content:center;color:#a9bac8;font-size:11px}.launch-countdown .time{text-align:center}.launch-countdown strong,.launch-countdown span{display:block}.launch-countdown strong{font-size:32px}.launch-countdown span{margin-top:4px;color:#7f93a6;font-size:9px}.launch-story{padding:35px 0 70px}.launch-story h2{font-size:clamp(38px,5vw,58px)}.launch-story>p{max-width:760px;color:#90a5b8;line-height:1.75}.launch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.launch-card{padding:22px;border:1px solid #173a58;border-radius:18px;background:linear-gradient(145deg,#071827,#0a1f31)}.launch-card b{color:#31b8ff;font-size:10px;letter-spacing:.12em}.launch-card h3{margin:14px 0 8px}.launch-card p{margin:0;color:#91a5b8;line-height:1.65;font-size:13px}.launch-contact{margin-bottom:80px;padding:28px;border:1px solid rgba(212,175,55,.22);border-radius:22px;background:linear-gradient(135deg,rgba(212,175,55,.07),rgba(8,125,247,.05)),#081827}.launch-contact h2{font-size:34px}.launch-contact p{color:#93a7b9;line-height:1.65}.launch-footer{min-height:100px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid rgba(255,255,255,.06);color:#8391a6;font-size:11px}.launch-error{max-width:720px;margin:110px auto;padding:28px;border:1px solid #693b3b;border-radius:20px;background:#1b0e13;color:#f7dddd}.launch-error h1{font-size:38px}.hidden{display:none!important}@media(max-width:900px){.launch-hero{grid-template-columns:1fr}.launch-meta{grid-template-columns:1fr 1fr}.launch-grid{grid-template-columns:1fr 1fr}.launch-countdown{grid-template-columns:repeat(2,1fr)}.launch-countdown .intro{grid-column:1/-1}}@media(max-width:620px){.launch-wrap{width:min(100% - 20px,1180px)}.launch-top{align-items:flex-start;padding:12px 0}.launch-hero{padding:52px 0 38px}.launch-hero h1{font-size:46px}.launch-stage{min-height:390px}.stage-plane{font-size:42px}.launch-meta,.launch-grid{grid-template-columns:1fr}.launch-countdown{grid-template-columns:1fr 1fr}.launch-footer{align-items:flex-start;flex-direction:column;padding:25px 0}}
  </style>
</head>
<body>
  <div class="launch-page">
    <div id="launch-root" class="launch-wrap">
      <div class="launch-error"><h1>Lansman hazırlanıyor…</h1><p>İçerik yükleniyor.</p></div>
    </div>
  </div>
  <script src="/lansman-runtime.js" defer></script>
</body>
</html>
